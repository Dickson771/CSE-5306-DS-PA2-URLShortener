version: "3.9"

services:
  raft-node1:
    image: python:3.11-slim
    working_dir: /app
    volumes:
      - ./:/app
    command: >
      sh -c "pip install -r consensus/requirements.txt && python -m consensus.raft_node run \
      --node-id 1 --host 0.0.0.0 --port 7101 \
      --peer 2=raft-node2:7102 --peer 3=raft-node3:7103 --peer 4=raft-node4:7104 --peer 5=raft-node5:7105"

  raft-node2:
    image: python:3.11-slim
